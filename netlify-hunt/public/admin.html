<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hasmukh Karkhana — Command</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Comic+Neue:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
.tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto}
.tab{padding:10px 16px;border-radius:12px;background:var(--card);border:1px solid var(--line);cursor:pointer;font-weight:600;white-space:nowrap;color:var(--muted)}
.tab.on{background:var(--gold);color:#000;border-color:var(--gold)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.qr{background:#fff;border-radius:14px;padding:10px;width:150px;height:150px;margin:0 auto 10px}
.qr svg{width:100%;height:100%;display:block}
.stcard{text-align:center}
.stcard code{display:block;font-size:12px;color:var(--muted);word-break:break-all;margin-top:4px}
.two{display:grid;gap:14px;grid-template-columns:260px 1fr}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.tlist .t{padding:12px 14px;border-radius:12px;cursor:pointer;border:1px solid transparent;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tlist .t.on{background:var(--card2);border-color:var(--gold)}
.stepbox{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.stepbox .head{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.stepbox select{flex:1}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;padding:4px 8px}
.x:hover{color:var(--red)}
#printSheet{display:none}
.mxwrap{overflow-x:auto;margin-top:8px}
table.mx{border-collapse:separate;border-spacing:4px;min-width:100%}
table.mx th{font:400 12px var(--head);letter-spacing:.12em;text-transform:uppercase;color:var(--lav);padding:4px 6px;text-align:center;vertical-align:bottom}
table.mx th.tn,table.mx td.tn{text-align:left;font:400 16px var(--head);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;padding:6px 10px}
table.mx td{height:38px;min-width:46px;text-align:center;font:400 18px var(--display);background:rgba(255,255,255,.04);border:2px solid var(--line)}
table.mx td.on{background:var(--gold);color:#000;border-color:var(--gold)}
table.mx td.done{background:var(--green);color:#03170e;border-color:var(--green)}
table.mx td.now{outline:3px solid #fff;outline-offset:1px}
table.mx td.none{color:#555}
.legend{display:flex;gap:14px;flex-wrap:wrap;font:400 12px var(--head);letter-spacing:.14em;color:var(--lav);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;vertical-align:middle;margin-right:6px}
.hint{font:600 13px/1.4 var(--hand);color:#cfc3f5;margin:4px 0 0}
.ghost-ph::placeholder{color:#8d7fc0}
@media print{
  body>*:not(#printSheet){display:none!important}
  body{background:#fff}
  #printSheet{display:grid!important;grid-template-columns:repeat(2,1fr);gap:18px;color:#000}
  #printSheet .p{border:2px dashed #999;border-radius:14px;padding:16px;text-align:center;break-inside:avoid;font-family:Inter,sans-serif}
  #printSheet .p svg{width:230px;height:230px}
  #printSheet h2{font-size:18px;margin:8px 0 0}
  #printSheet small{color:#444}
}
</style>
</head>
<body>
<div class="wrap wide" id="app"></div>
<div id="printSheet"></div>
<script>
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S = null, tab = localStorage.getItem('tab') || 'overview', selTeam = null, draft = null, timer = null;

async function api(path, method = 'GET', body) {
  const r = await fetch(path, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && j.error === 'admin') { S = null; throw Object.assign(new Error('admin'), { auth: true }); }
  if (!r.ok) throw new Error(j.error || 'Error');
  return j;
}
function toast(m) { const t = document.createElement('div'); t.className = 'toast rise'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2800); }
const base = () => location.origin;
function qrSvg(code) {
  if (typeof qrcode === 'undefined') return '<div style="color:#333;font-size:11px;padding:30px 6px">QR library blocked — needs internet</div>';
  const q = qrcode(0, 'M'); q.addData(`${base()}/q/${code}`); q.make(); return q.createSvgTag({ cellSize: 6, margin: 0, scalable: true });
}

async function load() {
  try { S = await api('/api/admin/state'); } catch (e) { if (e.auth) return loginView(); throw e; }
  if (!selTeam || !S.teams.find(t => t.id === selTeam)) selTeam = S.teams[0]?.id ?? null;
  draft = tab === 'teams' && draft ? draft : null;
  render();
}
async function logout() { await fetch('/api/logout', { method: 'POST' }); S = null; load(); }
function loginView() {
  clearInterval(timer);
  $app.innerHTML = `<div style="max-width:380px;margin:12vh auto 0" class="rise"><div class="center" style="margin-bottom:20px"><div class="sfx sm" style="display:inline-block;animation:none;font-size:56px;transform:rotate(-4deg)">COMMAND</div><div class="eyebrow" style="margin-top:12px">Organiser login</div></div>
  <form class="card" id="f"><label>Admin password</label><input type="password" name="p" required autofocus><div class="err" id="err"></div><button class="btn">Unlock</button></form></div>`;
  document.getElementById('f').onsubmit = async e => { e.preventDefault();
    try { await api('/api/admin/login', 'POST', { password: new FormData(e.target).get('p') }); load(); }
    catch (er) { document.getElementById('err').textContent = er.message; } };
}
const setTab = t => { tab = t; localStorage.setItem('tab', t); render(); };

function render() {
  clearInterval(timer);
  const tabs = [['overview', 'Live'], ['stations', 'QR stations'], ['teams', 'Teams & clues'], ['map', 'Route map'], ['activity', 'Activity'], ['settings', 'Settings']];
  $app.innerHTML = `<div class="top"><div class="brand"><div class="logo">HK</div><div>HASMUKH KARKHANA<small>COMMAND CENTRE</small></div></div>
    <span class="chip" onclick="logout()">Log out</span></div>
    <div class="tabs">${tabs.map(([k, l]) => `<div class="tab ${tab === k ? 'on' : ''}" onclick="setTab('${k}')">${l}</div>`).join('')}</div><div id="body"></div>`;
  ({ overview, stations, teams, map: routeMap, activity, settings })[tab]();
}

/* ---- Live ---- */
function overview() {
  const b = document.getElementById('body');
  b.innerHTML = `<div class="two"><div><div class="card"><div class="eyebrow">Hunt status</div>
      <h3>${S.settings.active ? '● RUNNING' : '❚❚ PAUSED'}</h3>
      <button class="btn ${S.settings.active ? 'ghost' : 'green'}" style="margin-top:8px" onclick="toggle()">${S.settings.active ? 'Pause hunt' : 'Start hunt'}</button></div>
      <div class="card"><h3>Active sabotages</h3>${S.locks.length ? S.locks.map(l => `<div class="item"><div style="flex:1"><b>${esc(l.victim)}</b> locked at ${esc(l.station)}<div class="small muted">by ${esc(l.byTeam)} · ${Math.ceil((l.until - S.now) / 60000)} min left</div></div><button class="btn sm ghost" onclick="unlock(${l.victimId},${l.stationId})">Lift</button></div>`).join('') : '<p class="muted small">None right now.</p>'}</div></div>
    <div class="card"><h3>Where is everyone?</h3>${S.teams.map(t => { const nx = t.route[t.progress]; const stn = nx && S.stations.find(x => x.id === nx.station_id); return `<div class="item"><div style="flex:1"><b>${esc(t.name)}</b><div class="small muted">${t.finishedAt ? 'Finished ★' : stn ? 'Heading to: ' + esc(stn.name) + ' (step ' + (t.progress + 1) + '/' + t.total + ')' : 'No route yet'}</div></div></div>`; }).join('') || '<p class="muted small">No teams.</p>'}</div>
      <div class="card"><h3>Leaderboard</h3>${S.leaderboard.map((t, i) => `<div class="lb"><div class="pos">${i + 1}</div><div style="flex:0 0 35%">${esc(t.name)}${t.finishedAt ? ' ★' : ''}</div><div class="bar"><i style="width:${t.total ? t.progress / t.total * 100 : 0}%"></i></div><div class="small muted" style="min-width:34px">${t.progress}/${t.total}</div><div class="small" title="Assists given (✚) · Sabotages given (✕)" style="min-width:62px;text-align:right">✚${t.assistsGiven} ✕${t.sabotagesGiven}</div></div>`).join('') || '<p class="muted">Add teams to get started.</p>'}</div></div>`;
  timer = setInterval(async () => { try { S = await api('/api/admin/state'); overview(); } catch {} }, 5000);
}
async function toggle() { await api('/api/admin/settings', 'PUT', { active: !S.settings.active }); load(); }
async function unlock(v, st) { await api(`/api/admin/locks/${v}/${st}`, 'DELETE'); load(); }

/* ---- Stations ---- */
function stations() {
  const b = document.getElementById('body');
  b.innerHTML = `<div class="card"><h3>Add a QR station</h3>
    <label style="margin-top:0">Name (organiser only)</label><input id="sn" placeholder="e.g. Library Pillar">
    <label>Riddle that leads TO this QR</label><textarea id="sr" placeholder="e.g. Where books sleep standing up, a stone giant holds the roof."></textarea>
    <label>Location hint (sent when a team presses Assist)</label><input id="sl" placeholder="e.g. Library, 2nd floor, behind the pillar">
    <button class="btn" style="margin-top:12px" onclick="addStation()">Add station</button>
    <p class="hint">How clues work: each station owns the riddle that leads to it. A team’s route is just an order of stations, so a team’s clue after step N is automatically the riddle of step N+1. You can still override any single clue in <b>Teams &amp; clues</b>.</p>
    <p class="small muted" style="margin:10px 0 0">QR links point to <code>${esc(base())}/q/…</code></p></div>
    <div class="row tight" style="margin-bottom:12px"><button class="btn sm" onclick="printAll()">Print all QR codes</button></div>
    <div class="grid">${S.stations.map(s => `<div class="card stcard"><div class="qr">${qrSvg(s.code)}</div><b>${esc(s.name)}</b><div class="hint">${s.riddle ? '“' + esc(s.riddle) + '”' : '<span style="color:var(--gold)">No riddle yet (teams will see “Find ' + esc(s.name) + '”)</span>'}</div><div class="small muted">${esc(s.location) || 'No location hint'}</div><code>${esc(s.code)}</code><div class="used">${usedBy(s.id)}</div>
    <div class="row" style="margin-top:10px"><button class="btn sm ghost" onclick="editStation(${s.id})">Edit</button><button class="btn sm ghost" onclick="delStation(${s.id})">Delete</button></div></div>`).join('')}</div>
    ${S.stations.length ? '' : '<p class="muted center">No stations yet.</p>'}`;
}
async function addStation() { const n = document.getElementById('sn').value, l = document.getElementById('sl').value, r = document.getElementById('sr').value;
  try { await api('/api/admin/stations', 'POST', { name: n, location: l, riddle: r }); load(); } catch (e) { toast(e.message); } }
async function editStation(id) { const s = S.stations.find(x => x.id === id);
  const n = prompt('Station name', s.name); if (n === null) return; const r = prompt('Riddle that leads to this QR', s.riddle || ''); if (r === null) return; const l = prompt('Location hint', s.location); if (l === null) return;
  await api('/api/admin/stations/' + id, 'PUT', { name: n, location: l, riddle: r }); load(); }
function usedBy(id) { const u = S.teams.map(t => { const i = t.route.findIndex(r => r.station_id === id); return i >= 0 ? `${esc(t.name)} #${i + 1}` : null; }).filter(Boolean); return u.length ? 'Used by: ' + u.join(' · ') : 'Not used in any route yet'; }
async function delStation(id) {
  const s = S.stations.find(x => x.id === id), used = S.teams.filter(t => t.route.some(r => r.station_id === id));
  const msg = used.length ? `“${s.name}” is used in: ${used.map(t => t.name).join(', ')}.\n\nDeleting removes it ONLY from those routes (their other steps stay). Continue?` : `Delete “${s.name}”?`;
  if (!confirm(msg)) return;
  try { await api('/api/admin/stations/' + id + (used.length ? '?force=1' : ''), 'DELETE'); draft = null; load(); } catch (e) { toast(e.message); }
}
function printAll() {
  document.getElementById('printSheet').innerHTML = S.stations.map(s => `<div class="p"><div style="font:400 22px Bangers,Impact,sans-serif;letter-spacing:.08em">HASMUKH KARKHANA</div>${qrSvg(s.code)}<h2>SCAN ME</h2><small>Code: ${esc(s.code)}</small></div>`).join('');
  setTimeout(() => window.print(), 100);
}

/* ---- Teams & routes ---- */
function teams() {
  const b = document.getElementById('body');
  const t = S.teams.find(x => x.id === selTeam);
  if (t && (!draft || draft.id !== t.id)) draft = { id: t.id, start: t.start_clue, route: t.route.map(r => ({ ...r })) };
  b.innerHTML = `<div class="two"><div>
    <div class="card"><h3>New team</h3><label style="margin-top:0">Team name</label><input id="tn"><label>Password</label><div class="row"><input id="tp" placeholder="team's login password"><button class="btn sm ghost" style="flex:none" onclick="document.getElementById('tp').value=genPw()">Generate</button></div><button class="btn" style="margin-top:12px" onclick="addTeam()">Create team</button></div>
    <div class="card tlist"><h3>Teams</h3>${S.teams.map(x => `<div class="t ${x.id === selTeam ? 'on' : ''}" onclick="pick(${x.id})"><span>${esc(x.name)}</span><span class="small muted">${x.route.length ? x.route.length + ' steps' : 'NO ROUTE'}</span></div>`).join('') || '<p class="muted small">None yet.</p>'}</div></div>
    <div>${t ? `<div class="card"><div class="row" style="margin-bottom:6px"><h3 style="flex:1">${esc(t.name)}’s route</h3><button class="btn sm ghost" style="flex:none" onclick="renameTeam(${t.id})">Rename</button><button class="btn sm ghost" style="flex:none" onclick="delTeam(${t.id})">Delete</button></div>
      <div class="stepbox"><div class="row"><div><div class="small muted">Login</div><div><b>${esc(t.name)}</b> / <code id="pwshow">${esc(t.password)}</code></div></div><button class="btn sm ghost" style="flex:none" onclick="copyLogin(${t.id})">Copy</button><button class="btn sm ghost" style="flex:none" onclick="resetPw(${t.id})">Change password</button></div>
      <div class="small muted" style="margin-top:8px">Progress ${t.progress}/${t.total} · <a href="#" onclick="resetTeam(${t.id});return false" style="color:var(--gold)">reset this team's progress</a></div></div>
      <p class="small muted" style="margin:0 0 6px"><b>This route belongs only to ${esc(t.name)}.</b> Editing it never changes any other team. The same QR can be in several teams’ routes. After a team scans step N’s QR, it automatically gets the riddle of step N+1’s QR (type a custom clue only if you want to override it for this team). After the last step it gets the finale message.</p>
      <div id="routeinfo"><div class="flow">${flowHtml()}</div>${healthHtml()}</div>
      <div class="row" style="margin:10px 0 0"><select id="copysrc"><option value="">Copy route from another team…</option>${S.teams.filter(x => x.id !== t.id && x.route.length).map(x => `<option value="${x.id}">${esc(x.name)} (${x.route.length} steps)</option>`).join('')}</select><button class="btn sm ghost" style="flex:none" onclick="copyRoute()">Copy</button></div>
      <label>Starting clue (points to step 1’s QR)</label><textarea id="startc" class="ghost-ph" placeholder="${esc(startAuto())}" oninput="refreshInfo()">${esc(draft.start)}</textarea><p class="hint">Leave blank to use the riddle of step 1’s QR automatically.</p>
      <label>Route</label><div id="steps">${draft.route.map((r, i) => `<div class="stepbox"><div class="head"><div class="num">${i + 1}</div>
        <select onchange="draft.route[${i}].station_id=+this.value;refreshInfo()"><option value="">— choose QR station —</option>${S.stations.map(s => `<option value="${s.id}" ${s.id === r.station_id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select>
        <button class="x" onclick="mv(${i},-1)">↑</button><button class="x" onclick="mv(${i},1)">↓</button><button class="x" onclick="rm(${i})">✕</button></div>
        <textarea class="ghost-ph" placeholder="${esc(autoClue(i))}" oninput="draft.route[${i}].clue=this.value;refreshInfo()">${esc(r.clue)}</textarea><div class="hint">${r.clue ? 'Custom clue for this team.' : 'Auto: uses ' + (i < draft.route.length - 1 ? 'the riddle of the next QR' : 'the finale message') + '. Type here to override.'}</div></div>`).join('')}</div>
      <div class="row"><button class="btn ghost" onclick="addStep()">+ Add step</button><button class="btn" onclick="saveRoute()">Save route</button></div></div>` : '<div class="card"><p class="muted">Create a team to build its route.</p></div>'}</div></div>`;
}
function flowHtml() {
  const nm = id => S.stations.find(s => s.id === id)?.name;
  const steps = draft.route.map((r, i) => nm(r.station_id) ? `<span>${i + 1}. ${esc(nm(r.station_id))}</span>` : `<span class="bad">${i + 1}. ? pick QR</span>`);
  return `<span class="s">START</span>${steps.map(x => `<em>▶</em>${x}`).join('')}<em>▶</em><span class="f">FINISH</span>`;
}
function healthHtml() {
  const w = [], ids = draft.route.map(r => +r.station_id).filter(Boolean);
  if (!draft.route.length) w.push('✕ No steps yet. This team has nothing to find.');
  if (draft.route.length && !draft.start.trim() && !hasRiddle(draft.route[0]?.station_id)) w.push('✕ No starting clue and step 1’s QR has no riddle. The team won’t know where to begin.');
  draft.route.forEach((r, i) => { if (!r.station_id) w.push(`✕ Step ${i + 1} has no QR chosen.`); else if (i < draft.route.length - 1 && !r.clue.trim() && !hasRiddle(draft.route[i + 1]?.station_id)) w.push(`✕ After step ${i + 1}: no custom clue and the next QR has no riddle.`); });
  ids.forEach((id, i) => { if (ids.indexOf(id) !== i) w.push(`✕ Step ${i + 1}: “${S.stations.find(s => s.id === id)?.name}” is already used earlier in this route.`); });
  return w.length ? w.map(x => `<div class="warn">${esc(x)}</div>`).join('') : '<div class="small" style="color:var(--green);font-family:var(--head);letter-spacing:.1em">✓ ROUTE LOOKS GOOD</div>';
}
const hasRiddle = id => !!S.stations.find(s => s.id === +id)?.riddle;
const stName = id => S.stations.find(s => s.id === +id)?.name || '?';
const autoFor = id => S.stations.find(s => s.id === +id)?.riddle || (id ? `Find “${stName(id)}”.` : '');
const startAuto = () => draft.route[0] ? 'Auto: ' + autoFor(draft.route[0].station_id) : 'Add a step first';
const autoClue = i => draft.route[i + 1] ? 'Auto: ' + autoFor(draft.route[i + 1].station_id) : 'Auto: ' + S.settings.finale;
function refreshInfo() { keepStart(); const el = document.getElementById('routeinfo'); if (el) el.innerHTML = `<div class="flow">${flowHtml()}</div>${healthHtml()}`; }
function copyRoute() { const id = +document.getElementById('copysrc').value; if (!id) return; const src = S.teams.find(x => x.id === id);
  if (draft.route.length && !confirm('Replace this team’s current steps with a copy of ' + src.name + '’s route? (Other teams stay untouched.)')) return;
  keepStart(); draft.route = src.route.map(r => ({ ...r })); teams(); toast('Copied. Now edit the clues for this team, then Save.'); }
const pick = id => { selTeam = id; draft = null; render(); };
const addStep = () => { draft.route.push({ station_id: '', clue: '' }); keepStart(); teams(); };
const rm = i => { draft.route.splice(i, 1); keepStart(); teams(); };
const mv = (i, d) => { const j = i + d; if (j < 0 || j >= draft.route.length) return; [draft.route[i], draft.route[j]] = [draft.route[j], draft.route[i]]; keepStart(); teams(); };
const keepStart = () => { const e = document.getElementById('startc'); if (e) draft.start = e.value; };
async function saveRoute() {
  keepStart();
  try { const r = await api('/api/admin/teams/' + draft.id, 'PUT', { start_clue: draft.start, route: draft.route });
    toast(r.before !== undefined && r.progress !== r.before ? `Saved ✔ Team progress adjusted ${r.before} → ${r.progress} to match the new route` : 'Saved ✔');
    draft = null; await load(); } catch (e) { toast(e.message); }
}
async function addTeam() { try { const r = await api('/api/admin/teams', 'POST', { name: document.getElementById('tn').value, password: document.getElementById('tp').value }); draft = null; selTeam = r.id; await load(); toast('Team created'); } catch (e) { toast(e.message); } }
const genPw = () => { const w = ['tiger','comet','pixel','maple','rocket','lotus','ember','cobalt','nova','falcon','mango','zebra']; return w[Math.random() * w.length | 0] + (100 + Math.random() * 900 | 0); };
async function resetPw(id) { const t = S.teams.find(x => x.id === id); const p = prompt('New password for ' + t.name, genPw()); if (p) { try { await api('/api/admin/teams/' + id, 'PUT', { password: p }); toast('Password changed'); draft = null; load(); } catch (e) { toast(e.message); } } }
async function renameTeam(id) { const t = S.teams.find(x => x.id === id); const n = prompt('Team name', t.name); if (n) { try { await api('/api/admin/teams/' + id, 'PUT', { name: n }); draft = null; load(); } catch (e) { toast(e.message); } } }
async function resetTeam(id) { if (confirm('Send this team back to the start?')) { await api(`/api/admin/teams/${id}/reset`, 'POST'); toast('Team reset'); load(); } }
function copyLogin(id) { const t = S.teams.find(x => x.id === id); const txt = `${S.settings.eventName}\n${base()}\nTeam: ${t.name}\nPassword: ${t.password}`; navigator.clipboard?.writeText(txt).then(() => toast('Copied ✔'), () => toast(txt)); }
async function delTeam(id) { if (confirm('Delete this team?')) { await api('/api/admin/teams/' + id, 'DELETE'); draft = null; selTeam = null; load(); } }

/* ---- Route map ---- */
function routeMap() {
  const st = S.stations, tm = S.teams;
  const cell = (t, s) => { const i = t.route.findIndex(r => r.station_id === s.id); if (i < 0) return '<td class="none">–</td>'; return `<td class="${i < t.progress ? 'done' : 'on'} ${i === t.progress ? 'now' : ''}" title="${esc(t.name)}: step ${i + 1}">${i + 1}</td>`; };
  const maxSteps = Math.max(0, ...tm.map(t => t.route.length));
  let clash = 0; for (let i = 0; i < maxSteps; i++) { const seen = {}; tm.forEach(t => { const r = t.route[i]; if (r) { seen[r.station_id] = (seen[r.station_id] || 0) + 1; } }); clash += Object.values(seen).filter(n => n > 1).length; }
  document.getElementById('body').innerHTML = `<div class="card"><h3>Route map</h3>
    <p class="hint" style="margin-top:0">Every row is one team’s own route. The number in a cell is the step at which that team visits that QR. Routes are independent: a team’s progress, clues and sabotages never affect another team’s route.</p>
    ${tm.length && st.length ? `<div class="mxwrap"><table class="mx"><tr><th class="tn">Team</th>${st.map(s => `<th>${esc(s.name)}</th>`).join('')}</tr>
      ${tm.map(t => `<tr><td class="tn">${esc(t.name)}</td>${st.map(s => cell(t, s)).join('')}</tr>`).join('')}</table></div>
      <div class="legend"><span><i style="background:var(--gold)"></i>TO DO</span><span><i style="background:var(--green)"></i>DONE</span><span><i style="outline:2px solid #fff"></i>CURRENT TARGET</span></div>
      <p class="hint">${clash ? `${clash} spot${clash > 1 ? 's' : ''} where two teams are at the same QR on the same step. That’s fine: those teams just get the normal clue there, with no “too early” or “intruder” message.` : 'No two teams are at the same QR on the same step. Nice and spread out.'}</p>` : '<p class="muted">Add stations and teams first.</p>'}</div>
    <div class="card hot"><h3>Auto-generate routes</h3>
      <p class="hint" style="margin-top:0">Gives every team its own route of <b>7 QRs</b> picked from all stations, as different from every other team as the maths allows: no two teams on the same QR at the same step, as few shared QRs as possible, and every QR used evenly. Clues come from each station’s riddle. This replaces all current routes and <b>resets all progress</b>, so use it before the hunt starts.</p>
      <label>QRs per team</label><input id="per" type="number" min="1" max="${st.length || 1}" value="${Math.min(7, st.length || 1)}">
      <button class="btn red" style="margin-top:12px" onclick="autoRoutes()">Generate routes for all teams</button></div>`;
}
async function autoRoutes() {
  if (!confirm('Replace EVERY team’s route and reset all progress?')) return;
  try { const r = await api('/api/admin/autoroute', 'POST', { perTeam: document.getElementById('per').value || 7 }); draft = null; await load(); toast(`Done: ${r.teams} routes of ${r.steps} QRs · ${r.samePosition} same-step overlaps`); } catch (e) { toast(e.message); }
}

/* ---- Activity ---- */
function activity() {
  const icon = { assist: '✚', sabotage: '✕', advance: '▶', finish: '★' };
  const line = e => e.type === 'assist' ? `<b>${esc(e.fromName)}</b> assisted <b>${esc(e.toName)}</b> at <i>${esc(e.stationName)}</i>`
    : e.type === 'sabotage' ? `<b>${esc(e.fromName)}</b> sabotaged <b>${esc(e.toName)}</b> at <i>${esc(e.stationName)}</i>`
    : e.type === 'finish' ? `<b>${esc(e.fromName)}</b> finished the hunt!` : `<b>${esc(e.fromName)}</b> found <i>${esc(e.stationName)}</i> (${e.step}/${e.total})`;
  document.getElementById('body').innerHTML = `<div class="card" style="max-width:720px"><h3>Live activity</h3>
    ${S.log.length ? S.log.map(e => `<div class="item"><div class="num">${icon[e.type] || '•'}</div><div style="flex:1">${line(e)}</div><div class="small muted">${new Date(e.at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}</div></div>`).join('') : '<p class="muted">Nothing yet. Assists, sabotages and QR finds show up here live.</p>'}</div>`;
  timer = setInterval(async () => { try { S = await api('/api/admin/state'); activity(); } catch {} }, 5000);
}

/* ---- Settings ---- */
function settings() {
  const s = S.settings;
  document.getElementById('body').innerHTML = `<div style="max-width:520px"><div class="card"><h3>Event</h3><label style="margin-top:0">Event name</label><input id="en" value="${esc(s.eventName)}">
    <label>Finale message (shown after a team’s last QR)</label><textarea id="fin">${esc(s.finale)}</textarea>
    <label>Sabotage lock duration (minutes)</label><input id="sm" type="number" min="1" max="120" value="${s.sabotageMinutes}">
    <label>Sabotage cooldown per team (minutes) — stops spamming</label><input id="cm" type="number" min="0" max="60" value="${s.cooldownMinutes}">
    <button class="btn" style="margin-top:14px" onclick="saveSettings()">Save</button></div>
    <div class="card"><h3>Danger zone</h3><p class="muted small">Sets every team back to the start and clears sabotages and messages. Routes and clues are kept.</p><button class="btn red" onclick="resetAll()">Reset all progress</button></div></div>`;
}
async function saveSettings() { await api('/api/admin/settings', 'PUT', { eventName: document.getElementById('en').value, finale: document.getElementById('fin').value, sabotageMinutes: document.getElementById('sm').value, cooldownMinutes: document.getElementById('cm').value }); toast('Saved ✔'); load(); }
async function resetAll() { if (confirm('Reset ALL team progress?')) { await api('/api/admin/reset', 'POST'); toast('Reset'); load(); } }

load();
</script>
</body>
</html>
